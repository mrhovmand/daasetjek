<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SP2 Dåsekontrol">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>SP2 Dåsekontrol – el-indstøbningsdåser og tegninger</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c1f24;--mut:#6b7280;--line:#d9dde3;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--acc:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:#0f766e;color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));z-index:5}
header h1{font-size:19px;margin:0}header small{color:#cbd5e1}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tabs button{border:1px solid var(--line);background:var(--card);padding:10px 14px;min-height:44px;border-radius:22px;font-size:16px;color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{scroll-margin-top:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,textarea,select{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;font-family:inherit;min-height:44px}
textarea{min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);padding:10px 14px;min-height:44px;border-radius:8px;font-size:16px;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;padding:10px 14px;min-height:44px;border-radius:8px;font-size:16px;color:var(--ink);flex:1 1 auto}
.seg button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.z{flex:0 0 auto;color:var(--mut)}
.lbl{font-size:14px;color:var(--mut);margin:10px 0 5px}
.pill{font-size:13px;padding:3px 9px;border-radius:10px;background:#eef0f3;color:var(--mut);white-space:nowrap}
.pill.ok{background:#dcfce7;color:var(--ok)}.pill.bad{background:#fee2e2;color:var(--bad)}.pill.w{background:#fef3c7;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td a{display:inline-block;padding:4px 0}
h2{font-size:17px;margin:4px 0 8px}
.mut{color:var(--mut);font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#eee}
.addph{position:relative;overflow:hidden}
.addph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
#viewer{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#viewer.on{display:flex}
#viewer .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .bar{display:flex;gap:8px;justify-content:space-between;color:#fff;padding:8px 0}
#viewer .btn{background:#222;color:#fff;border-color:#444}
#viewer .btn.d{color:#fca5a5}
.busy{opacity:.6;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;z-index:60;display:none}
.printonly{display:none}
@media print{header,.tabs,.noprint,#viewer,#toast{display:none!important}.printonly{display:block}.card{break-inside:avoid}body{background:#fff}.thumbs img{width:110px;height:110px}input,textarea{border:none;padding:0;min-height:0}}

.top{display:flex;gap:8px;align-items:center}
.top select{flex:1;font-weight:600;background:#fff}
.top .btn{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chips button{border:1px solid var(--line);background:#fff;padding:8px 12px;min-height:40px;border-radius:18px;font-size:15px;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ov td,.ov th{text-align:center;white-space:nowrap;padding:8px 5px}.ov td:first-child,.ov th:first-child{text-align:left}
.ov td.c{cursor:pointer}.ov td.c b{color:var(--bad)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#dlg.on{display:flex}
#dlg .sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;z-index:45;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:16px}
#upd.on{display:flex}#upd button{background:#fff;color:var(--acc);border:none;border-radius:8px;padding:10px 14px;font-size:16px;font-weight:600;min-height:44px}
/* tegninger */
#tgv{position:fixed;inset:0;background:#2b2f36;z-index:55;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#tgv.on{display:flex}
#tgv .tbar{display:flex;gap:6px;align-items:center;padding:6px 8px;color:#fff;background:#1c1f24}
#tgv .tbar .btn{background:#2f343c;color:#fff;border-color:#444;padding:8px 12px;min-width:44px}
#tgv .tbar .btn:disabled{opacity:.35}
#tgcap{flex:1;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#tgstage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#5b616b;-webkit-user-select:none;user-select:none}
#tgstage canvas{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#tgbase{background:#fff;box-shadow:0 0 12px rgba(0,0,0,.4)}
#tgmsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:10px;font-size:15px;text-align:center;max-width:85%;display:none;z-index:2}
#tgzl{position:absolute;right:8px;bottom:8px;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px;font-size:12px;z-index:2}
.tgc .btn{padding:8px 12px}
.qn{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qn button{border:1px solid var(--line);background:#fff;padding:6px 10px;min-height:36px;border-radius:16px;font-size:14px;color:var(--ink)}
.qn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{background:#ecfdf5;border-color:#a7f3d0}.note.w{background:#fffbeb;border-color:#fcd34d}
.ck{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;font-size:16px;min-height:48px;background:#fff;cursor:pointer}
.ck input{width:24px;height:24px;min-height:0;margin:0;padding:0;flex:0 0 auto;accent-color:#b91c1c}
.ck.on{border-color:var(--bad);background:#fee2e2;color:var(--bad);font-weight:600}
.typ{display:flex;flex-wrap:wrap;gap:6px}
.typ button{border:1px solid var(--line);background:#fff;padding:8px 12px;min-height:42px;border-radius:18px;font-size:15px;color:var(--ink)}
.typ button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ub{border:1px solid var(--line);background:#fff;border-radius:16px;padding:7px 10px;margin:3px 4px 3px 0;font-size:15px;color:var(--ink);min-height:38px}
.ova td{vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.big{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;min-height:64px;font-size:18px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}
.big small{font-size:13px;font-weight:400;color:var(--mut);margin-top:3px;line-height:1.3}
.big:active{background:#e8edf6}
.big .badge{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:14px;min-width:28px;height:28px;padding:0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.big .okn{color:var(--ok);font-weight:600}
.big .badn{color:var(--bad);font-weight:700}
.back{border:none;background:none;color:var(--acc);font-size:17px;padding:8px 0;min-height:44px;font-weight:600;cursor:pointer;font-family:inherit}
.hbar{display:flex;align-items:center;gap:8px}
.hbar h1{flex:1;font-size:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .btn{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25);padding:8px 12px;min-height:40px;font-size:15px}
.rum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.rum button{border:1px solid var(--line);background:#fff;padding:8px 12px;min-height:40px;border-radius:18px;font-size:14px;color:var(--ink);font-family:inherit}
.rum button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 0 4px}
</style>
</head>
<body>
<div id="upd"><span>Ny version af SP2 Dåsekontrol</span><button onclick="location.reload()">Genindlæs</button></div>
<header><div class="hbar"><button class="btn" id="hback" style="display:none" onclick="navBack()">‹ Tilbage</button><div style="flex:1;min-width:0"><h1 id="htitle">SP2 Dåsekontrol</h1><small id="ogsub"></small></div><button class="btn" onclick="menuDlg()">Menu</button></div></header>
<div class="wrap">
  <div class="printonly"><h2 id="ptitle"></h2></div>
  <div id="main"></div>
  <input id="proj" type="hidden" value="">
  <p class="mut noprint" id="stor" style="text-align:center;margin:18px 8px"></p>
</div>
<div id="dlg" onclick="if(event.target===this)closeDlg()"><div class="sheet" id="sheet"></div></div>
<div id="viewer" onclick="if(event.target===this||event.target.classList.contains('img'))closeViewer()">
  <div class="bar"><span id="vcap"></span><button class="btn" onclick="closeViewer()">Luk</button></div>
  <div class="img"><img id="vimg" alt=""></div>
  <div class="bar"><button class="btn" id="vprev" onclick="stepViewer(-1)">‹ Forrige</button><button class="btn d" onclick="delPhoto()">Slet billede</button><button class="btn" id="vnext" onclick="stepViewer(1)">Næste ›</button></div>
</div>
<div id="toast"></div>
<div id="tgv">
  <div class="tbar"><button class="btn" onclick="tgClose()">‹ Luk</button><div id="tgcap"></div></div>
  <div id="tgstage"><canvas id="tgbase"></canvas><div id="tgmsg"></div><div id="tgzl"></div></div>
  <div class="tbar" style="justify-content:space-between"><button class="btn" id="tgprev" onclick="tgStep(-1)">‹</button><button class="btn" onclick="tgZoomBy(1/1.8)">−</button><button class="btn" onclick="tgReset()">Tilpas</button><button class="btn" onclick="tgZoomBy(1.8)">+</button><button class="btn" id="tgnext" onclick="tgStep(1)">›</button></div>
</div>

<script>
/* ===== Konstanter ===== */
const STUE_PREFIX="st";                       // præfiks for stuelejligheder ved 4–6 boliger: st.1, st.2 …
const UNITS_23={2:["tv.","th."],3:["tv.","mf.","th."]};
const TAGCAT=["Solceller","Røgopluk","Gennemføring","Andet"];
const KEY="daasetjek2_v2";                      // SP2 Dåsekontrol har sin EGEN nøgle
const OLDKEY3="daasetjek_v3",OLDKEY1="daasetjek_v1",OLDDB="daasetjek_photos"; // Dåsetjek 1: læses kun, ændres aldrig
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2500)}
function now(){const d=new Date();return d.toLocaleDateString("da-DK")+" "+d.toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"})}

/* ===== Data og migrering ===== */
function newOg(name){return {id:"og"+uid(),name:name||"Opgang 1",units:2,top:3,kaelder:false,tgB:"",tgO:""}}
function migrate(old){ // v1/v2: {proj,boxes:[{loc:"Stue|Bolig TV",...}]}
  const og={id:"og1",name:"Opgang 1",units:2,top:3,kaelder:false};
  const FL=["Stue","1. sal","2. sal","3. sal"],UN={"Bolig TV":"1","Bolig TH":"2","Opgang":"OG"};
  const boxes=(old.boxes||[]).map(b=>{const[f,u]=String(b.loc||"").split("|");const i=FL.indexOf(f);const n={...b,og:og.id,fl:String(i<0?0:i),un:UN[u]||"OG"};delete n.loc;return n});
  return {v:3,proj:old.proj||"",ogs:[og],boxes,tag:[],cur:og.id,view:"oversigt",uf:""}}
const DTYPES=["Lampeudtag","Stikkontakt","Afbryder","Netværk","Andet"];
const ROOMS=["Køkken/alrum","Stue","Soveværelse","Værelse","Bad","Entré","Gang","Bryggers","Altan/terrasse","Trapperum"];
function migBox(b){ // gammel model (plac/ror/kom + fritekst nr) -> ny model (dåsetype + 2 afvigelser). Intet slettes: originalen gemmes i b.old
  if(b.m===2)return b;const nr=String(b.nr==null?"":b.nr).trim(),kom=String(b.kom||"");
  b.old={nr:b.nr,plac:b.plac,ror:b.ror,kom:b.kom};
  b.ad=b.plac==="forkert";b.ar=b.ror==="afvigelse";b.adNote="";b.arNote="";
  if(kom){if(b.ar){b.arNote=kom;b.kom=""}else if(b.ad){b.adNote=kom;b.kom=""}}  // ingen afvigelse: noten bliver som generel note
  const key=nr.toLowerCase().replace(/[.\s]+$/,"").replace("netvaerk","netværk");const t=DTYPES.find(x=>x.toLowerCase()===key);
  if(t){b.typ=t;b.typTxt="";b.nr=""}else if(!nr||/^\d+$/.test(nr)){b.typ="";b.typTxt=""}else{b.typ="Andet";b.typTxt=nr;b.nr=""}
  delete b.plac;delete b.ror;b.rum=b.rum||"";b.m=2;return b}
function fix(s){s.v=5;s.ogs=Array.isArray(s.ogs)&&s.ogs.length?s.ogs:[newOg()];s.boxes=s.boxes||[];s.tag=s.tag||[];if(s.cur&&!s.ogs.find(o=>o.id===s.cur))s.cur=s.ogs[0]?s.ogs[0].id:"";
  if(!s.view||s.view==="oversigt")s.view=s.cur?"floors":"home";
  s.ogs.forEach(o=>{o.tgB=o.tgB||"";o.tgO=o.tgO||""});s.tg=s.tg&&typeof s.tg==="object"?s.tg:{};s.tg.names=s.tg.names||{};s.boxes.forEach(migBox);s.uf=s.uf||"";return s}
let S;
function readOld(){ // kopi af Dåsetjek 1's data (kun læsning)
  let o=null;try{o=JSON.parse(localStorage.getItem(OLDKEY3)||"null")}catch(e){}
  if(o&&Array.isArray(o.ogs))return fix(JSON.parse(JSON.stringify(o)));
  let o1=null;try{o1=JSON.parse(localStorage.getItem(OLDKEY1)||"null")}catch(e){}
  return o1&&Array.isArray(o1.boxes)?migrate(o1):null}
(function(){let r=null;try{r=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  S=r||{proj:"",ogs:[],boxes:[],tag:[],v:5,view:"oversigt"}})();   // opgange oprettes fra tegningerne ved start (seedOgs)
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Kunne ikke gemme: "+e.message)}}

/* ===== Navne ===== */
const og=()=>S.ogs.find(o=>o.id===S.cur);
const ogById=id=>S.ogs.find(o=>o.id===id);
function flName(f){return f==="K"?"Kælder":f==="R"?"St.–2. sal":f==="0"?"Stue":/^\d-\d$/.test(f)?f.replace("-",".–")+". sal":f+". sal"}
function spanKey(d){if(d.f.length<2)return null;const a=d.f[0],z=d.f[d.f.length-1];return a==="st"&&z==="2"?"R":(a==="st"?"0":a)+"-"+z}
const flKeyOf=d=>spanKey(d)||(d.f[0]==="st"?"0":d.f[0]);
const flOrd=f=>f==="K"?-1:f==="R"?0.5:f==="0"?0:/^\d-\d$/.test(f)?+f[0]+0.5:+f;
function floorsOf(o){if(o.auto)return (o.kaelder?["K"]:[]).concat([...new Set(tgList(o.tgB,o.tgO||"").map(flKeyOf))].sort((a,b)=>flOrd(a)-flOrd(b)));const l=o.kaelder?["K"]:[];for(let i=0;i<=o.top;i++)l.push(String(i));return l}
function unitsOf(o,f){if(f==="K")return["OG"];if(o.auto){const l=tgList(o.tgB,o.tgO||"").filter(d=>flKeyOf(d)===f).map(d=>d.s);if(!/^R$|-/.test(f))l.push("OG");return l}const l=[];for(let i=1;i<=o.units;i++)l.push(String(i));l.push("OG");return l}
function unName(o,f,u){if(u==="OG")return f==="K"?"Kælder/opgang":"Opgang";if(o.auto)return unShort(o,f,u)+" ("+u+")";const i=+u;if(o.units<=3)return (UNITS_23[o.units]||[])[i-1]||("bolig "+i);return (f==="0"?STUE_PREFIX:f)+"."+i}
function tgf(f){return f==="R"?"st":f==="0"?"st":/^\d-\d$/.test(f)?f[0]:f}
function unShort(o,f,u){if(u==="OG")return f==="K"?"Kælder/opgang":"Opgang";const r=tgBySide(u);return r?(tgName(r.d)||"Bolig"):u}
function seedOgs(s){ // opretter opgange fra tegningerne efter faste id'er: kun manglende tilføjes, intet dubleres, slettede kommer ikke igen
  const all=[];Object.keys(TG).forEach(b=>tgOgs(b).forEach(x=>all.push({id:"tg_"+tgOL(b,x),b,x})));
  if(!Array.isArray(s.seedIds))s.seedIds=s.seeded==="tg1"?all.filter(z=>!TG[z.b].fx).map(z=>z.id):[];   // tg1 = I/J/K fra før F-tegningerne
  const have=new Set(s.ogs.map(o=>o.id)),done=new Set(s.seedIds);const add=[];
  all.forEach(({id,b,x})=>{if(have.has(id)||done.has(id))return;const rk=tgList(b,x).every(d=>spanKey(d)==="R");
    add.push({id,name:tgOL(b,x),auto:1,rk,tgB:b,tgO:x,kaelder:false,units:0,top:0})});
  s.seedIds=[...new Set(s.seedIds.concat(all.map(z=>z.id)))];s.seeded="tg2";
  if(add.length){s.ogs=s.ogs.concat(add);const auto=s.ogs.filter(o=>o.auto).sort((a,b)=>a.name.localeCompare(b.name,"da",{numeric:true}));s.ogs=auto.concat(s.ogs.filter(o=>!o.auto))}
  if(!s.cur||!s.ogs.find(o=>o.id===s.cur)){s.cur="";s.view="home"}}
function renameUnit(s){const r=tgBySide(s);if(!r)return;const v=prompt("Navn på boligen "+s+" (fx tv., th., mf., 1.2):",tgName(r.d)||"");if(v!=null)tgSetName(s,v)}
function colName(o,u){if(u==="OG")return"Opgang";return o.units<=3?(UNITS_23[o.units]||[])[+u-1]||u:"Bolig "+u}
function hidden(b,o){o=o||ogById(b.og);if(!o)return true;if(b.fl==="K")return !o.kaelder||b.un!=="OG";if(o.auto)return !floorsOf(o).includes(b.fl)||!unitsOf(o,b.fl).includes(b.un);if(+b.fl>o.top)return true;return b.un!=="OG"&&+b.un>o.units}
function where(b){const o=ogById(b.og);return (o?o.name:"?")+" · "+flName(b.fl)+" · "+(o?unName(o,b.fl,b.un):b.un)}

/* ===== Status ===== */
function stat(b){if(b.ad&&b.ar)return["bad","Afvigelse dåse + rør"];if(b.ad)return["bad","Afvigelse dåse"];if(b.ar)return["bad","Afvigelse rør"];return["ok","OK"]}
function typLbl(b){return b.typ==="Andet"?(b.typTxt?b.typTxt:"Andet"):(b.typ||"")}
function boxNo(b){if(/^\d+$/.test(String(b.nr||"")))return b.nr;const l=S.boxes.filter(x=>x.og===b.og&&x.fl===b.fl&&x.un===b.un);return String(l.indexOf(b)+1)}
function tstat(t){return t.status==="afvigelse"?["bad","Afvigelse"]:t.status==="ok"?["ok","OK"]:t.status==="note"?["w","Note"]:["","Ikke vurderet"]}
function counts(list){let c={n:list.length,ok:0,bad:0,open:0};list.forEach(b=>{const s=stat(b)[0];if(s==="ok")c.ok++;else if(s==="bad")c.bad++;else c.open++});return c}

/* ===== Billeder i IndexedDB (nøgle = dåse- eller tag-id) ===== */
const DBN="daasetjek2c_photos",ST="photos";let DB=null;let P={};const URLS={};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore(ST,{keyPath:"id"});s.createIndex("boxId","boxId")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(ST,mode);const s=t.objectStore(ST);let out;const r=fn(s);if(r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function loadPhotos(){const all=await tx("readonly",s=>s.getAll());P={};(all||[]).sort((a,b)=>a.t-b.t).forEach(p=>{(P[p.boxId]=P[p.boxId]||[]).push(p)})}
function openOldDB(){return new Promise(res=>{let r;try{r=indexedDB.open(OLDDB)}catch(e){return res(null)}
  r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};  // findes den ikke, oprettes den IKKE
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)})}
async function copyOldPhotos(){const odb=await openOldDB();if(!odb)return 0;let all=[];
  try{if(odb.objectStoreNames.contains("photos"))all=await new Promise((res,rej)=>{const q=odb.transaction("photos","readonly").objectStore("photos").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}finally{odb.close()}
  for(const p of all){await tx("readwrite",s=>s.put({id:p.id,boxId:p.boxId,t:p.t,blob:p.blob}))}return all.length}
async function recopy(){const r=readOld();
  if(!r){alert("Der er ingen data fra Dåsetjek 1 her.\n\nPå iPhone har hver app på hjemmeskærmen sin egen hukommelse. Gør sådan:\n1) Åbn Dåsetjek 1 og tryk 'Gem backup'.\n2) Åbn SP2 Dåsekontrol og tryk 'Indlæs backup'.");return}
  if(!confirm("Erstat alt i SP2 Dåsekontrol med data fra Dåsetjek 1 ("+r.ogs.length+" opgange, "+r.boxes.length+" dåser, inkl. billeder)?\n\nDine navne på tegninger beholdes. Dåsetjek 1 ændres ikke."))return;
  const tg=S.tg;const links={};S.ogs.forEach(o=>links[o.id]={tgB:o.tgB,tgO:o.tgO});
  S=fix(r);S.tg=tg;S.ogs.forEach(o=>{if(links[o.id]){o.tgB=links[o.id].tgB;o.tgO=links[o.id].tgO}});save();
  try{Object.values(URLS).forEach(u=>URL.revokeObjectURL(u));for(const k in URLS)delete URLS[k];await tx("readwrite",s=>s.clear());const n=await copyOldPhotos();await loadPhotos();S.copiedPhotos=n;S.notice="copied";save()}catch(x){alert("Billederne kunne ikke kopieres: "+x.message)}
  $("proj").value=S.proj||"";render();updStorage()}
function noticeHTML(){return "";if(S.notice==="copied"){const n=S.boxes.length;return `<div class="card note noprint"><b>✅ Data kopieret fra Dåsetjek 1</b><p class="mut" style="margin:6px 0">${S.ogs.length} opgange, ${n} dåser og ${S.photoCopy==="pending"?"billeder (kopieres…)":(S.copiedPhotos||0)+" billeder"}. Den gamle Dåsetjek er uændret – men det du registrerer herfra, gemmes kun i SP2 Dåsekontrol.</p><button class="btn" onclick="S.notice='';save();render()">OK</button></div>`}
  if(S.notice==="none")return `<div class="card note w noprint"><b>Velkommen til SP2 Dåsekontrol – nu med tegninger</b><p class="mut" style="margin:6px 0">Der blev ikke fundet data fra Dåsetjek 1 her. På iPhone har hver app på hjemmeskærmen sin egen hukommelse. Vil du have dine opgange med over: åbn Dåsetjek 1 → <b>Gem backup</b> → åbn SP2 Dåsekontrol → <b>Indlæs backup</b> (nederst under Data).</p><button class="btn" onclick="S.notice='';save();render()">OK</button></div>`;return ""}
function pcount(id){return (P[id]||[]).length}
function purl(p){return URLS[p.id]||(URLS[p.id]=URL.createObjectURL(p.blob))}
function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const M=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Kunne ikke komprimere")),"image/jpeg",0.75)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Ukendt billedformat"))};img.src=u})}
function item(id){return S.boxes.find(b=>b.id===id)||S.tag.find(t=>t.id===id)}
async function addPhotos(id,input){const files=[...input.files];input.value="";if(!files.length)return;const card=$("b_"+id);card&&card.classList.add("busy");let n=0;
  for(const f of files){try{const blob=await compress(f);const p={id:uid(),boxId:id,t:Date.now(),blob};await tx("readwrite",s=>s.put(p));(P[id]=P[id]||[]).push(p);n++}catch(e){alert("Billedet kunne ikke gemmes: "+e.message)}}
  const b=item(id);if(b){b.tid=now();save()}render();if(n)toast(n===1?"Billede gemt":n+" billeder gemt");updStorage()}
async function deletePhotosOf(id){for(const p of (P[id]||[])){await tx("readwrite",s=>s.delete(p.id));if(URLS[p.id]){URL.revokeObjectURL(URLS[p.id]);delete URLS[p.id]}}delete P[id]}
let V={box:null,i:0};
function openViewer(id,i){V={box:id,i};showViewer();$("viewer").classList.add("on")}
function showViewer(){const l=P[V.box]||[];if(!l.length){closeViewer();return}V.i=(V.i+l.length)%l.length;$("vimg").src=purl(l[V.i]);const b=S.boxes.find(x=>x.id===V.box),t=S.tag.find(x=>x.id===V.box);$("vcap").textContent=(b?"Dåse "+boxNo(b)+(typLbl(b)?" "+typLbl(b):"")+" · ":t?(t.title||t.cat)+" · ":"")+"Billede "+(V.i+1)+" af "+l.length;$("vprev").style.visibility=$("vnext").style.visibility=l.length>1?"visible":"hidden"}
function stepViewer(d){V.i+=d;showViewer()}
function closeViewer(){$("viewer").classList.remove("on");$("vimg").removeAttribute("src")}
async function delPhoto(){const l=P[V.box]||[];const p=l[V.i];if(!p||!confirm("Slet dette billede?"))return;await tx("readwrite",s=>s.delete(p.id));l.splice(V.i,1);if(URLS[p.id]){URL.revokeObjectURL(URLS[p.id]);delete URLS[p.id]}if(!l.length){delete P[V.box];closeViewer()}else showViewer();render();updStorage()}
function photoBlock(id){const l=P[id]||[];return `<div class="lbl">Billeder${l.length?" ("+l.length+")":""}</div>`+(l.length?`<div class="thumbs">${l.map((p,i)=>`<img src="${purl(p)}" alt="Billede ${i+1}" onclick="openViewer('${id}',${i})">`).join("")}</div>`:"")}
function addPhotoBtn(id){return `<label class="btn p addph">📷 Tilføj billede<input type="file" accept="image/*" multiple onchange="addPhotos('${id}',this)"></label>`}

/* ===== Visning (El-planer-stil: knapper for bygning → opgang → etage → bolig) ===== */
$("proj").value=S.proj||"";
const badge=n=>n?`<span class="badge">${n}</span>`:"";
function ogProg(o){const c=counts(S.boxes.filter(b=>b.og===o.id));const ta=S.tag.filter(t=>t.og===o.id&&t.status==="afvigelse").length;return{c,ta,afv:c.bad+ta}}
function flProg(o,f){return counts(S.boxes.filter(b=>b.og===o.id&&b.fl===f))}
function unProg(o,f,u){return counts(S.boxes.filter(b=>b.og===o.id&&b.fl===f&&b.un===u))}
function progLine(c){if(!c.n)return "Ingen dåser endnu";return c.n+" "+(c.n===1?"dåse":"dåser")+(c.bad?` · <span class="badn">${c.bad} afv.</span>`:` · <span class="okn">alle OK</span>`)}
function ogSubLine(o){if(!o)return "";if(o.auto){const nb=floorsOf(o).reduce((a,f)=>a+unitsOf(o,f).filter(u=>u!=="OG").length,0);const fl=floorsOf(o).filter(f=>f!=="K");return `${nb} ${nb===1?"bolig":"boliger"} · ${o.kaelder?"kælder + ":""}${o.rk?"rækkehus st.–2. sal":flName(fl[0])+(fl.length>1?" til "+flName(fl[fl.length-1]):"")}`}
  return `${o.units} boliger pr. etage · ${o.kaelder?"kælder + ":""}stue til ${o.top?o.top+". sal":"stue"}`}
function whereShort(o,f,u){return o.name+(f?` · ${f==="TAG"||f==="tag"?"Tag":flName(f)}`:"")+(u?` · ${unShort(o,f,u)}`:"")}
function headBar(){const o=og();const back=$("hback"),ht=$("htitle"),sub=$("ogsub");
  let showBack=false,title="SP2 Dåsekontrol",subtxt="";
  if(S.view==="home"||!S.cur){title="SP2 Dåsekontrol";subtxt="Vælg opgang"}
  else if(S.view==="tegn"){showBack=true;title="Tegninger";subtxt=o?o.name:""}
  else if(S.view==="afvig"){showBack=true;title="Afvigelser";subtxt="Alle opgange"}
  else if(S.view==="tag"){showBack=true;title=o.name+" · Tag";subtxt=ogSubLine(o)}
  else if(S.view==="floors"){showBack=true;title=o.name;subtxt=ogSubLine(o)}
  else if(S.view.startsWith("f:")){const f=S.view.slice(2);showBack=true;
    if(S.uf){title=whereShort(o,f,S.uf);subtxt=progLine(unProg(o,f,S.uf)).replace(/<[^>]+>/g,"")}
    else{title=o.name+" · "+flName(f);subtxt="Vælg bolig"}}
  else{showBack=!!S.cur;title=o?o.name:"SP2 Dåsekontrol";subtxt=ogSubLine(o)}
  back.style.display=showBack?"":"none";ht.textContent=title;sub.textContent=subtxt}
function navBack(){const o=og();
  if(S.view==="tegn"||S.view==="afvig"){S.view=S.cur?"floors":"home";S.uf="";save();render();scrollTo(0,0);return}
  if(S.view==="tag"){S.view="floors";S.uf="";save();render();scrollTo(0,0);return}
  if(S.view.startsWith("f:")&&S.uf){S.uf="";save();render();scrollTo(0,0);return}
  if(S.view.startsWith("f:")){S.view="floors";S.uf="";save();render();scrollTo(0,0);return}
  if(S.view==="floors"){S.cur="";S.view="home";S.uf="";save();render();scrollTo(0,0);return}
  S.view="home";S.uf="";save();render();scrollTo(0,0)}
function pickOg(id){S.cur=id;S.view="floors";S.uf="";save();render();scrollTo(0,0)}
function go(v,uf){S.view=v;S.uf=uf||"";save();render();scrollTo(0,0)}
function goHome(){S.cur="";S.view="home";S.uf="";save();render();scrollTo(0,0)}
function goFloor(f){S.view="f:"+f;S.uf="";save();render();scrollTo(0,0)}
function goUnit(f,u){S.view="f:"+f;S.uf=u;save();render();scrollTo(0,0)}

function unitHead(o,f,u,l){const c=counts(l);return `<div class="card" style="background:#eef2ff" id="u_${f}_${u}"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${flName(f)} · ${unName(o,f,u)}</h2><span class="mut">${c.n} ${c.n===1?"dåse":"dåser"}${c.bad?" · "+c.bad+" afv.":" · alle OK"}</span></div><div class="row noprint" style="margin-top:8px"><button class="btn p" onclick="add('${f}','${u}')">+ Tilføj dåse</button>${tgBtn(o,f,u)}${o.auto&&u!=="OG"?unitNameBtns(u):""}</div></div>`}

<p class="mut">Tal = registrerede dåser (✓ = ingen afvigelser), rødt tal = dåser med afvigelse. Tryk på et felt for at åbne boligen.${o.units>3?` Boligerne hedder fx 1.1, 1.2 på 1. sal og ${STUE_PREFIX}.1 i stuen.`:""}</p></div>`;

<p class="mut">Tryk på en bolig for at registrere dåser. Tal = registrerede dåser (✓ = ingen afvigelser), rødt tal = dåser med afvigelse.${o.rk?" Rækkehuset har én tegning for stue til 2. sal.":floorsOf(o).some(f=>/-/.test(f))?" Duplexboligerne har én tegning for "+flName(floorsOf(o).find(f=>/-/.test(f)))+".":""}${tgList(o.tgB,o.tgO).some(d=>d.x)?" Bofællesskabet markeret B1/B2 ligger mellem B1 og B2 og vises under begge.":""}</p></div>`;
  const hid=mine.filter(b=>hidden(b,o));if(hid.length){h+=`<div class="sec">Skjulte dåser (${hid.length})</div>`;hid.forEach(b=>h+=boxHTML(b,flName(b.fl)+" · "+b.un))}

let PRINTALL=false;
function render(){const o=og();let h="";$("ptitle").textContent="SP2 Dåsekontrol"+(S.proj?" – "+S.proj:"")+" · udskrevet "+now();$("proj").value=S.proj||"";
  if(PRINTALL){S.ogs.forEach(x=>{h+=`<h2 style="margin-top:18px">${esc(x.name)}</h2>`;floorsOf(x).forEach(f=>h+=floorHTML(x,f,"",true));const hid=S.boxes.filter(b=>b.og===x.id&&hidden(b,x));hid.forEach(b=>h+=boxHTML(b,"Skjult: "+flName(b.fl)+" · bolig "+b.un));const tl=S.tag.filter(t=>t.og===x.id);if(tl.length){h+=`<div class="sec">Tag</div>`;tl.forEach(t=>h+=tagHTML(t))}})}
  else if(!S.cur||S.view==="home"){S.view="home";h+=noticeHTML()+homeView()}
  else if(S.view==="floors"||S.view==="oversigt"){S.view="floors";h+=floorsView(o)}
  else if(S.view==="tegn")h+=tegnView();
  else if(S.view==="tag")h+=tagView(o);
  else if(S.view==="afvig"){const bl=S.boxes.filter(b=>stat(b)[0]==="bad"),tl=S.tag.filter(t=>t.status==="afvigelse");h+=`<button class="back" onclick="navBack()">‹ Tilbage</button><h2>Afvigelser – alle opgange (${bl.length+tl.length})</h2>`;
    S.ogs.forEach(x=>{const b2=bl.filter(b=>b.og===x.id),t2=tl.filter(t=>t.og===x.id);if(!b2.length&&!t2.length)return;h+=`<div class="sec"><a href="#" onclick="pickOg('${x.id}');return false">${esc(x.name)}</a></div>`;
      b2.forEach(b=>{const pc=pcount(b.id);h+=boxHTML(b,flName(b.fl)+" · "+unName(x,b.fl,b.un)+(typLbl(b)?" · "+typLbl(b):"")+(b.rum?" · "+b.rum:"")+(pc?" · 📷 "+pc:" · ingen billeder"))});
      t2.forEach(t=>{const pc=pcount(t.id);h+=tagHTML(t,"Tag · "+t.cat+(pc?" · 📷 "+pc:" · ingen billeder"))})});
    if(!bl.length&&!tl.length)h+=`<p class="mut">Ingen afvigelser registreret.</p>`}
  else if(S.view.startsWith("f:")){const f=S.view.slice(2);if(!floorsOf(o).includes(f)){S.view="floors";return render()}
    h+=S.uf&&unitsOf(o,f).includes(S.uf)?unitView(o,f,S.uf):unitsView(o,f)}
  else{S.view="floors";return render()}
  $("main").innerHTML=h;headBar()}

function tadd(){const t={id:uid(),og:S.cur,cat:"Solceller",title:"",status:"",kom:"",tid:now()};S.tag.push(t);save();render();setTimeout(()=>{const e=$("b_"+t.id);e&&e.scrollIntoView({behavior:"smooth"})},50)}

<div class="lbl">Kælder i opgangen?</div><div class="seg"><button class="${D.kaelder?"ok":""}" onclick="D.kaelder=true;drawDlg()">Ja</button><button class="${!D.kaelder?"ok":""}" onclick="D.kaelder=false;drawDlg()">Nej</button></div>

${D.tgB?`<div class="lbl">Tegninger: opgang i ${D.tgB}</div><div class="seg">${tgOgs(D.tgB).map(x=>`<button class="${(D.tgO||"")===x?"ok":""}" onclick="D.tgO='${x}';tgAutoName(D);drawDlg()">${tgOL(D.tgB,x)}</button>`).join("")}</div><div class="mut" style="margin-top:4px">Tegninger findes for: ${tgFls(D.tgB,D.tgO||"").map(TGFL).join(", ")}. Boligerne kobles til tegningerne via navnet (tv., th., 1.2 …) – ret navnene under 📐 Tegninger.</div>`:""}

function saveDlg(){const name=(D.name||"").trim()||"Opgang";
  if(D.auto){const o=ogById(D.id);const lost=S.boxes.filter(b=>b.og===o.id&&b.fl==="K").length;if(o.kaelder&&!D.kaelder&&lost&&!confirm(lost+" dåse(r) i kælderen skjules (slettes ikke). Fortsæt?"))return;o.name=name;o.kaelder=D.kaelder;save();closeDlg();render();toast("Opsætning gemt");return}const cfg={id:D.id,name,units:D.units,top:D.top,kaelder:D.kaelder,tgB:D.tgB||"",tgO:D.tgB?(D.tgO||""):""};

async function delOg(){const o=ogById(D.id);const b=S.boxes.filter(x=>x.og===o.id),t=S.tag.filter(x=>x.og===o.id);

/* ===== Eksport / backup ===== */
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function exportCSV(){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';let r=[["Projekt","Opgang","Etage","Lokation","Dåse/punkt","Dåsetype","Rum/placering","Afvigelse dåse","Note dåse","Afvigelse rør","Note rør","Note","Status","Antal billeder","Senest ændret"].join(";")];
  S.ogs.forEach(o=>{S.boxes.filter(b=>b.og===o.id).forEach(b=>{r.push([S.proj,o.name,flName(b.fl),(hidden(b,o)?"(skjult) ":"")+unName(o,b.fl,b.un),"Dåse "+boxNo(b),typLbl(b),b.rum,b.ad?"Ja":"Nej",b.ad?b.adNote:"",b.ar?"Ja":"Nej",b.ar?b.arNote:"",b.kom,stat(b)[1],pcount(b.id),b.tid].map(q).join(";"))});
    S.tag.filter(t=>t.og===o.id).forEach(t=>r.push([S.proj,o.name,"Tag",t.cat,t.title,"","","","","","",t.kom,tstat(t)[1],pcount(t.id),t.tid].map(q).join(";")))});
  dl("sp2-daasekontrol-"+stamp()+".csv","\ufeff"+r.join("\r\n"),"text/csv")}
function b64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)})}
async function backup(){const list=Object.values(P).flat();const size=list.reduce((a,p)=>a+p.blob.size,0);

/* Knapper i dåse-visningen */
function tgFloorCard(o,f){if(!o.tgB||!TG[o.tgB])return "";if(f==="K")return planCardFor(o,"K");const tf=tgf(f);const l=tgList(o.tgB,o.tgO||"",tf);const pc=planFor(o.tgB,f==="R"?"0":/^\d-\d$/.test(f)?f[0]:f);
  return `<div class="card noprint" style="padding:10px"><div class="row" style="justify-content:space-between"><b>📐 Tegninger · ${tgOL(o.tgB,o.tgO||"")} · ${flName(f)}</b></div><div class="chips" style="margin:8px 0 0">${l.map(d=>`<button onclick="tgOpenD('${d.s}','${tf}')">${esc(tgName(d)||"?")} <span class="mut">(${d.s})</span></button>`).join("")}<button onclick="tgOpenOv('${o.tgB}')">🗺 Oversigtsplan</button>${pc.map(planChip).join("")}</div>${l.length?"":`<p class="mut">Ingen tegninger for denne etage.</p>`}</div>`}
function tgBtn(o,f,u){if(!o.tgB||!TG[o.tgB])return "";if(u==="OG")return `<button class="btn" onclick="tgOpenOv('${o.tgB}')">🗺 Oversigtsplan</button>`;
  if(o.auto)return `<button class="btn" onclick="tgOpenD('${u}','${tgf(f)}')">📐 Tegning</button>`;
  const tf=dfl2tg(f);const l=tgList(o.tgB,o.tgO||"",tf);const m=l.filter(d=>tgName(d)===unName(o,f,u));
  if(m.length===1)return `<button class="btn" onclick="tgOpenD('${m[0].s}','${tf}')">📐 Tegning${tgOk(m[0])?"":" (foreslået)"}</button>`;
  return l.length?`<button class="btn" onclick="tgChoose('${o.id}','${f}','${u}')">📐 Vælg tegning</button>`:""}
function tgChoose(oid,f,u){const o=ogById(oid);const tf=dfl2tg(f);const l=tgList(o.tgB,o.tgO||"",tf);const nm=unName(o,f,u);
  $("sheet").innerHTML=`<h2>Tegning til ${esc(o.name)} · ${flName(f)} · ${esc(nm)}</h2><p class="mut" style="margin:0">${tgOL(o.tgB,o.tgO||"")}</p><p class="mut">Ingen tegning hedder "${esc(nm)}" endnu. Åbn tegningerne og vælg den, der passer – så husker appen det.</p>`+
   l.map(d=>`<div class="card"><b>Side ${d.s}</b> <span class="mut">· ${esc(tgName(d)||"uden navn")}${tgOk(d)?"":" (foreslået)"}</span><div class="mut">${esc(tgDesc(d))}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="tgOpenD('${d.s}','${tf}',1)">📐 Åbn</button><button class="btn p" onclick="S.tg.names['${d.s}']='${esc(nm)}';save();closeDlg();render();toast('Side ${d.s} er nu ${esc(nm)}');tgOpenD('${d.s}','${tf}')">Det er ${esc(nm)}</button></div></div>`).join("")+
   `<div class="row" style="margin-top:12px"><button class="btn" onclick="closeDlg()">Luk</button></div>`;$("dlg").classList.add("on")}
/* ===== Tegningsviser: PDF.js, knib-zoom og skarp gen-rendering ===== */
let PDFJS=null;const DOCS={};
async function pdfjs(){if(!PDFJS){const m=await import("./pdfjs/pdf.min.mjs");m.GlobalWorkerOptions.workerSrc=new URL("pdfjs/pdf.worker.min.mjs",location.href).href;PDFJS=m}return PDFJS}
async function getBuf(url){let c=null;try{c=await caches.open(TGC)}catch(e){}let r=c?await c.match(url):null;
  if(!r){r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);if(c){try{await c.put(url,r.clone())}catch(e){}}}return await r.arrayBuffer()}
function tgDocFor(b){if(DOCS[b])return DOCS[b];const f=b==="F"?TGF:b==="FF"?TGFF:b.startsWith("P:")?planDoc(b.slice(2)):TG[b];
  for(const k in DOCS)if(k!=="F"&&k!=="FF"){const p=DOCS[k];delete DOCS[k];p.then(d=>d.destroy()).catch(()=>{})}
  tgMsg(`Henter tegninger for ${b==="F"||b==="FF"?"signaturer/situationsplan":b.startsWith("P:")?"bygningsplan":"bygning "+b} (${String(f.mb).replace(".",",")} MB)…`);
  const p=(async()=>{const lib=await pdfjs();const buf=await getBuf(f.file);return await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise})();
  DOCS[b]=p;p.catch(()=>{if(DOCS[b]===p)delete DOCS[b]});return p}
const TV={list:[],i:0,page:null,z:1,tx:0,ty:0,fit:1,pw:0,ph:0,W:0,H:0,bk:1,tok:0,rt:null,dt:null,det:null,timer:0};
function tgMsg(t){const e=$("tgmsg");e.textContent=t||"";e.style.display=t?"block":"none"}
function tgShow(list,i,keep){if(!keep)closeDlg();TV.list=list;TV.i=Math.max(0,i||0);$("tgv").classList.add("on");document.body.style.overflow="hidden";tgLoad()}
function tgOpenD(s,f,keep){const r=tgBySide(s);if(!r)return;const{b,d}=r;const fl=f&&d.f.includes(f)?f:d.f[0];const l=tgList(b,d.o,fl);tgShow(l.map(x=>({b,p:x.p,cap:tgCap(b,x)})),l.indexOf(d),keep)}
/* Tegning fra en dåse */
function tgAutoName(D){if(D.tgB&&/^(Opgang( [A-Z0-9]+)?|[A-Z]\d-?[A-G]?|[A-Z]\d)$/.test((D.name||"").trim()))D.name=tgOL(D.tgB,D.tgO||"")}
let TGBOX=null;
function boxTg(id){const b=item(id);if(!b)return;TGBOX=id;const o=ogById(b.og);if(!o)return;
  if(!o.tgB||!TG[o.tgB])return tgLinkDlg(o.id,b.fl,b.un);
  if(b.un==="OG"||b.fl==="K")return tgOpenOv(o.tgB);
  if(o.auto)return tgOpenD(b.un,tgf(b.fl));
  const tf=dfl2tg(b.fl);const l=tgList(o.tgB,o.tgO||"",tf);const m=l.filter(d=>tgName(d)===unName(o,b.fl,b.un));
  if(m.length===1)return tgOpenD(m[0].s,tf);
  if(l.length)return tgChoose(o.id,b.fl,b.un);
  toast("Ingen tegninger for "+flName(b.fl)+" i "+tgOL(o.tgB,o.tgO||""));tgOpenOv(o.tgB)}
let LK=null;
function tgLinkDlg(oid,f,u){LK={oid,f,u,b:""};drawLk();$("dlg").classList.add("on")}
function drawLk(){const o=ogById(LK.oid);
  $("sheet").innerHTML=`<h2>Kobl ${esc(o.name)} til tegninger</h2><p class="mut">Opgangen er ikke koblet til tegningerne endnu. Vælg bygning og opgang – det huskes for hele opgangen.</p>
<div class="lbl">Bygning</div><div class="seg">${Object.keys(TG).map(b=>`<button class="${LK.b===b?"ok":""}" onclick="LK.b='${b}';drawLk()">${b}</button>`).join("")}</div>
${LK.b?`<div class="lbl">Opgang</div><div class="seg">${tgOgs(LK.b).map(x=>`<button onclick="tgLinkSet('${x}')">${tgOL(LK.b,x)}</button>`).join("")}</div>`:""}
<div class="row" style="margin-top:14px"><button class="btn" onclick="closeDlg()">Annullér</button></div>`}
function tgLinkSet(x){const o=ogById(LK.oid);o.tgB=LK.b;o.tgO=x;const d={name:o.name,tgB:o.tgB,tgO:x};tgAutoName(d);o.name=d.name;save();closeDlg();render();toast("Opgangen er koblet til tegningerne for "+tgOL(o.tgB,x));
  const b=S.boxes.find(y=>y.og===o.id&&y.fl===LK.f&&y.un===LK.u);if(b)boxTg(b.id);else tgOpenOv(o.tgB)}
function tgOpenOv(b){tgShow([{b,p:TG[b].ov,cap:"Oversigtsplan · "+b},{b,p:TG[b].idx,cap:"Index · bygning "+b}],0)}
function tgOpenF(p,bb){const k=bb&&TG[bb]&&TG[bb].fx?TG[bb].fx:"F";tgShow([{b:k,p:2,cap:"Signaturforklaring og noter"},{b:k,p:1,cap:"Situationsplan / nøgleplan"}],p===2?0:1)}
function tgStep(k){if(TV.list.length<2)return;TV.i=(TV.i+k+TV.list.length)%TV.list.length;tgLoad()}
function tgClear(){if(TV.rt){try{TV.rt.cancel()}catch(e){}TV.rt=null}if(TV.dt){try{TV.dt.cancel()}catch(e){}TV.dt=null}clearTimeout(TV.timer);if(TV.det){TV.det.width=0;TV.det.remove();TV.det=null}const c=$("tgbase");c.width=0;c.height=0;c.style.width=c.style.height="0px"}
function tgClose(){if(TGBOX){const e=$("b_"+TGBOX);TGBOX=null;if(e){const r=e.getBoundingClientRect();if(r.top<70||r.top>innerHeight-120)scrollBy(0,r.top-80)}}TV.tok++;tgClear();TV.page=null;$("tgv").classList.remove("on");document.body.style.overflow="";tgMsg("")}
async function tgLoad(){const it=TV.list[TV.i];const tok=++TV.tok;tgClear();TV.page=null;
  $("tgcap").textContent=it.cap+(TV.list.length>1?` (${TV.i+1}/${TV.list.length})`:"");$("tgprev").disabled=$("tgnext").disabled=TV.list.length<2;tgMsg("Indlæser tegning…");
  try{const doc=await tgDocFor(it.b);if(tok!==TV.tok)return;tgMsg("Tegner…");const page=await doc.getPage(it.p);if(tok!==TV.tok)return;TV.page=page;tgFit();await tgBase(tok);if(tok===TV.tok)tgMsg("")}
  catch(e){if(tok!==TV.tok||(e&&e.name==="RenderingCancelledException"))return;const m=String(e&&e.message||e);const net=!navigator.onLine||e instanceof TypeError||/fetch|network|load failed|HTTP 5/i.test(m);
    tgMsg(net?"Tegningen er ikke gemt på telefonen endnu, og der er ingen forbindelse. Åbn den igen, når du har net – så gemmes den til offline brug.":"Tegningen kunne ikke åbnes: "+m)}}
function tgDims(){const st=$("tgstage");TV.W=st.clientWidth;TV.H=st.clientHeight}
function tgFit(){tgDims();const v=TV.page.getViewport({scale:1});TV.fit=Math.min(TV.W/v.width,TV.H/v.height);ZMAX=Math.min(64,Math.max(24,4/TV.fit));TV.pw=v.width*TV.fit;TV.ph=v.height*TV.fit;TV.z=1;TV.tx=(TV.W-TV.pw)/2;TV.ty=(TV.H-TV.ph)/2;tgApply()}
async function tgBase(tok){const dpr=window.devicePixelRatio||1;TV.bk=Math.max(1,Math.min(2*dpr,Math.sqrt(6e6/(TV.pw*TV.ph))));
  const c=$("tgbase");const vp=TV.page.getViewport({scale:TV.fit*TV.bk});c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=TV.pw+"px";c.style.height=TV.ph+"px";tgApply();
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);const t=TV.page.render({canvasContext:ctx,viewport:vp});TV.rt=t;await t.promise;if(TV.rt===t)TV.rt=null;if(tok===TV.tok)tgSched()}
function tgApply(){const b=$("tgbase");b.style.transform=`translate(${TV.tx}px,${TV.ty}px) scale(${TV.z})`;const d=TV.det;if(d&&d.st){const r=TV.z/d.st.z;d.style.transform=`translate(${TV.tx-d.st.tx*r}px,${TV.ty-d.st.ty*r}px) scale(${r})`}$("tgzl").textContent=TV.z<1.01?"Knib eller dobbelttryk for at zoome":Math.round(TV.z*100)+" %"}
function tgSched(){clearTimeout(TV.timer);TV.timer=setTimeout(tgDetail,160)}
async function tgDetail(){if(!TV.page||TV.rt)return;const tok=TV.tok;if(TV.dt){try{TV.dt.cancel()}catch(e){}TV.dt=null}const dpr=window.devicePixelRatio||1;
  if(TV.z*dpr<=TV.bk*1.02){if(TV.det){TV.det.width=0;TV.det.remove();TV.det=null}return}   // grundbilledet er skarpt nok
  const c=document.createElement("canvas");c.className="tgdet";c.width=Math.ceil(TV.W*dpr);c.height=Math.ceil(TV.H*dpr);c.style.width=TV.W+"px";c.style.height=TV.H+"px";
  const st={z:TV.z,tx:TV.tx,ty:TV.ty};const vp=TV.page.getViewport({scale:TV.fit*TV.z*dpr,offsetX:TV.tx*dpr,offsetY:TV.ty*dpr});
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(Math.max(0,TV.tx*dpr),Math.max(0,TV.ty*dpr),TV.pw*TV.z*dpr,TV.ph*TV.z*dpr);
  const t=TV.page.render({canvasContext:ctx,viewport:vp,background:"rgba(0,0,0,0)"});TV.dt=t;
  try{await t.promise}catch(e){c.width=0;return}if(tok!==TV.tok||TV.dt!==t){c.width=0;return}TV.dt=null;
  c.st=st;if(TV.det){TV.det.width=0;TV.det.remove()}$("tgstage").insertBefore(c,$("tgmsg"));TV.det=c;tgApply()}
function tgClamp(){const w=TV.pw*TV.z,h=TV.ph*TV.z,W=TV.W,H=TV.H;
  TV.tx=w<=W?(W-w)/2:Math.min(W*0.25,Math.max(W*0.75-w,TV.tx));TV.ty=h<=H?(H-h)/2:Math.min(H*0.25,Math.max(H*0.75-h,TV.ty))}
const ZMIN=1;let ZMAX=24;   // sættes pr. side i tgFit: store A0/A1-ark kan zoomes længere
function tgZoomAt(z,x,y){if(!TV.page)return;z=Math.min(ZMAX,Math.max(ZMIN,z));const r=z/TV.z;TV.tx=x-(x-TV.tx)*r;TV.ty=y-(y-TV.ty)*r;TV.z=z;tgClamp();tgApply();tgSched()}
function tgZoomBy(k){tgZoomAt(TV.z*k,TV.W/2,TV.H/2)}
function tgReset(){if(!TV.page)return;TV.z=1;tgClamp();tgApply();tgSched()}
(function(){const st=$("tgstage");const PT=new Map();let GL=null,TAP=null,LAST=null;
  const rel=e=>{const r=st.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const gest=()=>{const a=[...PT.values()];const c={x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length};return{c,d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0,n:a.length}};
  st.addEventListener("pointerdown",e=>{e.preventDefault();try{st.setPointerCapture(e.pointerId)}catch(x){}PT.set(e.pointerId,rel(e));GL=gest();TAP=PT.size===1?{...GL.c,moved:false}:null});
  st.addEventListener("pointermove",e=>{if(!PT.has(e.pointerId)||!TV.page)return;e.preventDefault();PT.set(e.pointerId,rel(e));const g=gest();
    if(GL&&g.n===GL.n){let z=TV.z;if(g.n>1&&GL.d>10)z=Math.min(ZMAX,Math.max(ZMIN*0.9,TV.z*g.d/GL.d));const r=z/TV.z;TV.tx=g.c.x-(GL.c.x-TV.tx)*r;TV.ty=g.c.y-(GL.c.y-TV.ty)*r;TV.z=z;tgClamp();tgApply();tgSched()}
    if(TAP&&Math.hypot(g.c.x-TAP.x,g.c.y-TAP.y)>8)TAP.moved=true;GL=g});
  const up=e=>{if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);GL=PT.size?gest():null;if(TV.z<ZMIN){tgReset()}
    if(e.type==="pointerup"&&TAP&&!TAP.moved&&!PT.size){const t=Date.now();if(LAST&&t-LAST.t<350&&Math.hypot(TAP.x-LAST.x,TAP.y-LAST.y)<40){if(TV.z>1.5)tgReset();else tgZoomAt(3.5,TAP.x,TAP.y);LAST=null}else LAST={x:TAP.x,y:TAP.y,t}}if(!PT.size)TAP=null};
  st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
  st.addEventListener("wheel",e=>{e.preventDefault();const p=rel(e);tgZoomAt(TV.z*Math.exp(-e.deltaY/300),p.x,p.y)},{passive:false});
  ["gesturestart","gesturechange"].forEach(n=>document.addEventListener(n,e=>{if($("tgv").classList.contains("on"))e.preventDefault()}));
  let rz=0;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!$("tgv").classList.contains("on")||!TV.page)return;const tok=TV.tok;if(TV.det){TV.det.width=0;TV.det.remove();TV.det=null}tgFit();tgBase(tok).catch(()=>{})},200)});
  document.addEventListener("keydown",e=>{if(!$("tgv").classList.contains("on"))return;if(e.key==="Escape")tgClose();else if(e.key==="ArrowRight")tgStep(1);else if(e.key==="ArrowLeft")tgStep(-1);else if(e.key==="+")tgZoomBy(1.5);else if(e.key==="-")tgZoomBy(1/1.5)});
})();

/* ===== Start + opdatering ===== */
(async()=>{seedOgs(S);fix(S);if(S.view==="oversigt")S.view=S.cur?"floors":"home";save();render();
  try{DB=await openDB();
    if(S.photoCopy==="pending"){try{S.copiedPhotos=await copyOldPhotos()}catch(e){S.copiedPhotos=0}S.photoCopy="done";save()}
    await loadPhotos()}catch(e){toast("Billeder er ikke tilgængelige i denne browser")}
  render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  updStorage();
  if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)$("upd").classList.add("on")});
    navigator.serviceWorker.register("sw.js").then(r=>{r.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
  }
})();
</script>

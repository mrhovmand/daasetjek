<title>Pladsen – tegninger &amp; afvigelser</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#1c1f24;--mut:#5b6472;--line:#d6dce5;--ok:#15803d;--bad:#c2410c;--red:#dc2626;--acc:#1e3a8a;--warn:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:10px 14px 0;padding-top:calc(10px + env(safe-area-inset-top));z-index:5}
header h1{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
header h1 small{font-weight:400;font-size:13px;color:#c7d2fe}
.tabs{display:flex;gap:0}
.tabs button{flex:1;border:none;background:transparent;color:#c7d2fe;font-size:17px;font-weight:600;padding:12px 6px;min-height:50px;border-bottom:4px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#fb923c}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:15px}
h2{font-size:20px;margin:4px 0 10px}h3{font-size:17px;margin:14px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.big{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;min-height:64px;font-size:19px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.big small{font-size:13px;font-weight:400;color:var(--mut);margin-top:2px}
.big:active{background:#e8edf6}
.badge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:14px;min-width:28px;height:28px;padding:0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:10px 16px;min-height:48px;border-radius:12px;font-size:17px;cursor:pointer;color:var(--ink);font-family:inherit}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.w{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.d{background:#fff;color:var(--red);border-color:#fca5a5}
.btn.xl{width:100%;min-height:64px;font-size:21px;font-weight:700;border-radius:16px}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{border:none;background:none;color:var(--acc);font-size:17px;padding:8px 0;min-height:44px;font-weight:600;cursor:pointer}
.crumb{font-size:15px;color:var(--mut);margin:0 0 4px}
textarea,select,input{font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{min-height:56px;font-size:19px;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:14px;color:var(--ink)}
.who button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs .t{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#e5e7eb;cursor:pointer;display:block}
.thumbs .x{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:16px;border:none;background:var(--red);color:#fff;font-size:18px;font-weight:700}
.warnbox{background:#fff7ed;border:1px solid #fdba74;border-radius:14px;padding:12px;margin:10px 0}
.item{border-left:6px solid var(--bad)}
.item.q{border-left-color:#9ca3af;background:#f9fafb}
.item .loc{font-size:18px;font-weight:700}
.item .txt{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.pill{display:inline-block;font-size:13px;padding:2px 8px;border-radius:10px;background:#e5e7eb;color:#374151;font-weight:600}
.pill.q{background:#fef3c7;color:#92400e}
.pill.new{background:var(--red);color:#fff;margin-left:4px}
.tbadge{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border-radius:12px;min-width:24px;height:24px;padding:0 7px;font-size:14px;font-weight:700;margin-left:4px;vertical-align:middle}
#demo{background:#fde68a;color:#78350f;font-size:14px;padding:8px 12px;text-align:center;font-weight:600;display:none}
#queue{display:none;background:#fef3c7;border:1px solid #f59e0b;color:#78350f;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;align-items:center;justify-content:space-between;gap:8px}
#queue.on{display:flex}
#ptr{text-align:center;color:var(--mut);font-size:14px;height:0;overflow:hidden;transition:height .15s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:22px;font-size:16px;z-index:90;display:none;max-width:90%;text-align:center}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:70;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:100%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
#form .sheet{height:100%;border-radius:0}
.res{text-align:center;padding:20px 8px}.res .ic{font-size:60px}.res h2{font-size:24px}
#photo{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#photo.on{display:flex}#photo .bar{display:flex;justify-content:space-between;align-items:center;padding:8px;color:#fff;gap:8px}
#photo .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}#photo img{max-width:100%;max-height:100%}
#photo .btn{background:#222;color:#fff;border-color:#444}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));background:#0f172a;color:#fff;border-radius:12px;padding:10px 14px;z-index:95;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:16px}
#upd.on{display:flex}#upd button{background:#fff;color:#0f172a;border:none;border-radius:8px;padding:10px 14px;font-size:16px;font-weight:600;min-height:44px}
.fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:736px;margin:0 auto}
/* tegningsviser (fra Dåsetjek 2) */
#tgv{position:fixed;inset:0;background:#2b2f36;z-index:55;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#tgv.on{display:flex}
#tgv .tbar{display:flex;gap:6px;align-items:center;padding:6px 8px;color:#fff;background:#1c1f24}
#tgv .tbar .btn{background:#2f343c;color:#fff;border-color:#444;padding:8px 12px;min-width:48px;min-height:46px}
#tgv .tbar .btn.w{background:var(--bad);border-color:var(--bad);font-weight:700}
#tgv .tbar .btn:disabled{opacity:.35}
#tgcap{flex:1;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#tgstage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#5b616b;-webkit-user-select:none;user-select:none}
#tgstage canvas{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#tgbase{background:#fff;box-shadow:0 0 12px rgba(0,0,0,.4)}
#tgmsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);padding:10px 14px;border-radius:10px;font-size:15px;text-align:center;max-width:85%;display:none;z-index:2}
#tgzl{position:absolute;right:8px;bottom:8px;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px;font-size:12px;z-index:2}
#tgafvn{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;padding:6px 10px;border-radius:10px;font-size:14px;font-weight:700;z-index:2;display:none}
</style>
</head>

</div>

const TGF={file:"../v2/tegninger/faelles.pdf",mb:0.3};
const TGC="pladsen-tegninger-v1";            // samme navn som i sw.js
const TGFLS=["st","1","2","3","4","5"];
const tgOL=(b,o)=>o?b+"-"+o:b;               // K1-A, J2-B, K3
const tgDesc=d=>d.t.replace(/,?\s*Byg [A-G]\b/,"");
const tgName=d=>d.g;
function tgOgs(b){return TG[b]?[...new Set(TG[b].d.map(d=>d.o))].sort():[]}
function tgFls(b,o){const s=new Set();(TG[b]?TG[b].d:[]).filter(d=>d.o===o).forEach(d=>d.f.forEach(x=>s.add(x)));return TGFLS.filter(x=>s.has(x))}
function tgList(b,o,f){return (TG[b]?TG[b].d:[]).filter(d=>d.o===o&&(!f||d.f.includes(f)))}
function tgBySide(s){const b=s.split("-")[0];const d=TG[b]&&TG[b].d.find(x=>x.s===s);return d?{b,d}:null}
function tgCap(b,d){const n=tgName(d);return `${tgOL(b,d.o)} · ${n?n+" · ":""}Side ${d.s} – ${tgDesc(d)}`}

/* ===== Steder: opgang → etage → bolig ===== */
const OGS=[];Object.keys(TG).forEach(b=>tgOgs(b).forEach(o=>{const rk=TG[b].d.filter(d=>d.o===o).every(d=>d.f.length>1);OGS.push({id:tgOL(b,o),b,o,rk,fls:rk?["R"]:tgFls(b,o)})}));
const ogById=id=>OGS.find(x=>x.id===id);
const flName=f=>f==="st"?"Stue":f==="R"?"Rækkehus st.–2. sal":f==="TAG"?"Tag":f+". sal";
const flShort=f=>f==="st"?"st.":f==="R"?"":f==="TAG"?"":f+". sal";
function unitsOf(og,f){if(f==="TAG")return[{k:"TAG",name:"Tag"}];
  const l=tgList(og.b,og.o,f==="R"?null:f).map(d=>({k:d.s,name:tgName(d)||(og.rk?"Rækkehus":"Bolig"),d}));
  if(!og.rk)l.push({k:"OG",name:"Opgang / trappe"});return l}
function unitOf(og,f,k){return unitsOf(og,f).find(u=>u.k===k)}
const locKey=(og,f,k)=>og+"|"+f+"|"+k;
function locInfo(key){const[oid,f,k]=key.split("|");const og=ogById(oid);const u=og&&unitOf(og,f,k);
  return{og:oid,f,k,opgang:oid,etage:flName(f),bolig:u?u.name:k,side:/^[A-Z]\d-\d+$/.test(k)?k:"",
    label:oid+(f==="TAG"?" · Tag":" · "+flName(f)+" · "+(u?u.name:k)+(/^[A-Z]\d-\d+$/.test(k)?" ("+k+")":""))}}
function rowLabel(r){return r.opgang+(r.etage==="Tag"?" · Tag":" · "+r.etage+" · "+r.bolig+(r.side?" ("+r.side+")":""))}

function idb(store,mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}

async function okOrThrow(r){if(r.ok)return r;let t="";try{t=await r.text()}catch(e){}const e=new Error("HTTP "+r.status+" "+t.slice(0,200));e.status=r.status;e.body=t;throw e}

/* ===== Udbakke: gem lokalt først, send bagefter, prøv igen automatisk ===== */
let FLUSHING=null;
function flush(manual){if(FLUSHING)return FLUSHING;FLUSHING=(async()=>{let netErr=null,sent=0;
  for(const it of QUEUE.slice()){
    try{
      for(let i=0;i<it.photos.length;i++){if(it.up[i])continue;await API.upload(it.row.photos[i],it.photos[i]);it.up[i]=true;await qPut(it)}
      if(!it.ins){await API.insert(it.row);it.ins=true;it.sentAt=Date.now();await qPut(it);sent++;onSent(it)}
      if(it.ins){await qDel(it.id);QUEUE=QUEUE.filter(x=>x.id!==it.id)}
    }catch(e){it.err=String(e.message||e);it.tries=(it.tries||0)+1;await qPut(it).catch(()=>{});netErr=e;if(e instanceof TypeError||!navigator.onLine)break}
  }
  FLUSHING=null;updQueue();
  if(sent)await refresh(true);else render();
  if(manual&&netErr)toast(QUEUE.filter(x=>!x.ins).length?"Kunne ikke sende endnu – prøver igen automatisk":"Sendt");
  return !netErr})();return FLUSHING}
function pending(){return QUEUE.filter(x=>!x.ins)}
function updQueue(){const n=pending().length;$("queue").classList.toggle("on",n>0);$("queueTxt").textContent=n===1?"📤 1 rapport venter på at blive sendt":"📤 "+n+" rapporter venter på at blive sendt"}
setInterval(()=>{if(pending().length&&!document.hidden)flush()},20000);
window.addEventListener("online",()=>{if(QUEUE.length)flush();refresh()});

  await Promise.race([flush(),new Promise(r=>setTimeout(r,45000))]);
  const ok=WAIT.done;WAIT=null;
  $("formS").innerHTML=ok?`<div class="res"><div class="ic">✅</div><h2>Rapporten er sendt</h2><p>${esc(L.label)}</p><p class="mut">${DEMO?"(Demo: kun gemt på denne telefon.)":"Den ligger nu på Fejllisten hos alle."}</p><button class="btn p xl" onclick="closeForm()">OK</button></div>`
    :`<div class="res"><div class="ic">📥</div><h2>Gemt – sendes senere</h2><p>Der er ingen forbindelse lige nu. Rapporten er gemt på telefonen og bliver sendt automatisk, når der er net.</p><p class="mut">${esc(it.err||"")}</p><button class="btn p xl" onclick="closeForm()">OK</button></div>`;
  render()}

/* ===== Slet ===== */
let DEL=null;
function askDel(id){const r=openItems().find(x=>x.id===id);if(!r)return;DEL={id,navn:P.navn};drawDel()}
function drawDel(){const r=openItems().find(x=>x.id===DEL.id);
  $("dlgS").innerHTML=`<h2>Er du sikker på, at du vil slette denne afvigelse?</h2><p><b>${esc(rowLabel(r))}</b><br>${esc(r.tekst||"")}</p><p class="mut">Slet den kun, når fejlen er udbedret. Den forsvinder fra alles liste.</p>
<h3>Hvem sletter?</h3><div class="who">${NAVNE.map(n=>`<button class="${DEL.navn===n?"on":""}" onclick="DEL.navn='${n}';drawDel()">${n}</button>`).join("")}</div>
<div style="height:14px"></div><button class="btn w xl" onclick="doDel()" ${DEL.navn?"":"disabled"}>Ja, slet</button><div style="height:8px"></div><button class="btn xl" onclick="closeDlg()">Annullér</button><p id="derr" style="color:var(--red)"></p>`;$("dlg").classList.add("on")}
function closeDlg(){$("dlg").classList.remove("on");DEL=null}
async function doDel(){const d=DEL;$("derr").textContent="Sletter …";try{await API.del(d.id,d.navn);P.navn=P.navn||d.navn;P.list=P.list.filter(x=>x.id!==d.id);saveP();closeDlg();toast("Afvigelsen er slettet");render();refresh(true)}
  catch(e){$("derr").textContent=(e instanceof TypeError||!navigator.onLine)?"Ingen forbindelse – prøv igen, når der er net.":"Kunne ikke slette: "+(e.message||e)}}

/* ===== Fuld billedvisning ===== */
let PH={r:null,i:0};
async function showPhoto(id,i){const r=openItems().find(x=>x.id===id);if(!r)return;PH={r,i};$("photo").classList.add("on");loadPhoto()}
async function loadPhoto(){const{r,i}=PH;const n=(r.thumbs||[]).length;$("pcap").textContent=rowLabel(r)+(n>1?` (${i+1}/${n})`:"");$("pprev").disabled=$("pnext").disabled=n<2;
  const img=$("pimg");img.src="data:image/jpeg;base64,"+r.thumbs[i];
  let src=null;const q=QUEUE.find(x=>x.id===r.id);if(q&&q.photos[i])src=URL.createObjectURL(q.photos[i]);else if(r.photos&&r.photos[i])src=await photoSrc(r.photos[i]);
  if(src&&PH.r===r&&PH.i===i){const im=new Image();im.onload=()=>{if(PH.r===r&&PH.i===i)img.src=src};im.src=src}}
function stepPhoto(k){const n=(PH.r.thumbs||[]).length;PH.i=(PH.i+k+n)%n;loadPhoto()}
function closePhoto(){$("photo").classList.remove("on");$("pimg").src=""}

/* ===== Tegningsviser: åbning + afvigelse fra tegningen ===== */
function tgOpenD(s,f,ogid,fl){const r=tgBySide(s);if(!r)return;const{b,d}=r;const ff=f&&d.f.includes(f)?f:null;const l=tgList(b,d.o,ff||(d.f.length>1?null:d.f[0]));
  tgShow(l.map(x=>({b,p:x.p,cap:tgCap(b,x),loc:locKey(ogid,fl,x.s)})),l.indexOf(d))}
function tgOpenOv(b,loc){tgShow([{b,p:TG[b].ov,cap:"Oversigtsplan · "+b,loc},{b,p:TG[b].idx,cap:"Index · bygning "+b,loc}],0)}
function tgOpenF(p){tgShow([{b:"F",p:2,cap:"Signaturforklaring og noter"},{b:"F",p:1,cap:"Situationsplan / nøgleplan"}],p===2?0:1)}
function tgClose(){TV.tok++;tgClear();TV.page=null;$("tgv").classList.remove("on");document.body.style.overflow="";tgMsg("");render()}
function tgAfvUpd(){const it=TV.list[TV.i]||{};$("tgafv").style.display=it.loc?"":"none";const n=it.loc?openItems().filter(r=>r.loc===it.loc).length:0;const e=$("tgafvn");e.style.display=n?"block":"none";e.textContent=n===1?"⚠ 1 åben afvigelse her":"⚠ "+n+" åbne afvigelser her"}
function tgAfv(){const it=TV.list[TV.i];if(it&&it.loc)openForm(it.loc)}
function tgShowExisting(){const it=TV.list[TV.i];if(!it||!it.loc)return;const[o,f,k]=it.loc.split("|");tgClose();P.tab="tg";go(o,f,k)}

/* Gem alle tegninger til offline brug */
async function prefetchAll(){const fs=["../v2/pdfjs/pdf.min.mjs","../v2/pdfjs/pdf.worker.min.mjs",TGF.file,...Object.values(TG).map(x=>x.file)];let i=0;const b=$("pfb");if(b)b.disabled=true;
  try{for(const f of fs){i++;const e=$("pfs");if(e)e.textContent="Henter "+i+" af "+fs.length+" …";await getBuf(f)}const e=$("pfs");if(e)e.textContent="✅ Alle tegninger er gemt – de kan nu åbnes uden net.";toast("Alle tegninger er gemt på telefonen")}
  catch(x){const e=$("pfs");if(e)e.textContent="Stoppede ved fil "+i+": "+(x.message||x)+". Prøv igen på wifi.";}if(b)b.disabled=false}

/* ===== Træk ned for at opdatere ===== */
(function(){let y0=null,dy=0;const pt=$("ptr");
  addEventListener("touchstart",e=>{y0=(scrollY<=0&&P.tab==="fejl"&&!document.querySelector(".ov.on,#tgv.on,#photo.on"))?e.touches[0].clientY:null;dy=0},{passive:true});
  addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){pt.style.height=Math.min(60,dy/2)+"px";pt.textContent=dy>110?"Slip for at opdatere":"Træk ned for at opdatere"}},{passive:true});
  addEventListener("touchend",()=>{if(y0!=null&&dy>110){pt.textContent="Opdaterer …";refresh().then(()=>{pt.style.height="0"})}else pt.style.height="0";y0=null})})();

/* ===== Start ===== */
(async()=>{if(DEMO)$("demo").style.display="block";if(location.hash==="#fejl"){P.tab="tg";history.replaceState(null,"",location.pathname)}if(P.tab==="fejl"){P.tab="tg";tab("fejl")}
  if(P.og&&!ogById(P.og))P.og=P.f=P.k="";render();
  try{DB=await openDB();QUEUE=await qAll();QUEUE.sort((a,b)=>a.ts-b.ts)}catch(e){toast("Telefonens lager kan ikke bruges – rapporter kan ikke gemmes offline")}
  render();refresh(true);if(QUEUE.length)flush();
  setInterval(()=>{if(!document.hidden)refresh(true)},POLL_MS);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){refresh(true);if(QUEUE.length)flush()}});
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)$("upd").classList.add("on")});
    navigator.serviceWorker.register("sw.js").then(r=>{r.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
  }
})();
</script>
